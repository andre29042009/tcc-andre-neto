<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histórico | {{ politician.name }} | MAPC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mapc.css') }}">
</head>
<body class="app-body history-body">
  <header class="app-header"><a class="brand" href="/">MAPC</a><a class="history-back" href="/promessas">Voltar aos mandatos</a></header>
  <main class="app-shell history-shell">
    <div class="eyebrow">Linha do tempo do mandato</div>
    <h1>{{ politician.name }}</h1>
    <p class="history-meta">{{ politician.office }} · {{ politician.party }} · {{ politician.state }}</p>
    <div id="historyResults" class="history-results"><div class="empty">Carregando histórico...</div></div>
  </main>
  <script>window.POLITICIAN_ID = {{ politician.id|tojson }};</script>
  <script src="{{ url_for('static', filename='js/history.js') }}"></script>
</body>
</html>
